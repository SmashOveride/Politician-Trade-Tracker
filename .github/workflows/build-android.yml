# Builds the Android (Lite) APK entirely on GitHub's own Ubuntu runners --
# no local Android Studio/SDK needed, the same idea as build-macos.yml using
# a GitHub-hosted Mac for the macOS .app builds. ubuntu-latest ships a
# preinstalled Android SDK, and gradle/actions/setup-gradle provisions
# Gradle itself, so there's no wrapper jar checked into the repo either
# (android/ intentionally has no gradlew -- see android/README.md).
#
# Triggered manually (Actions tab -> this workflow -> "Run workflow"), which
# produces an unsigned debug APK as a workflow artifact for smoke-testing,
# or automatically whenever a version tag (vX.Y.Z) is pushed -- in which
# case a signed release APK is also built and attached to that tag's GitHub
# Release automatically, alongside the desktop builds.
name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"

      - name: Build unsigned debug APK
        working-directory: android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Only for tag-triggered runs, since release signing needs the
      # keystore secrets below -- see README's "Android build & signing"
      # section for the one-time setup that populates them.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            android/app/build/outputs/apk/release/*.apk \
            --clobber
